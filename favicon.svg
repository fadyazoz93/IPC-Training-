<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)" />
  
  <!-- Subtle accent circle -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 2.5" opacity="0.6"/>

  <!-- Medical Cross / White Center -->
  <path d="M26 21 h12 v7 h7 v12 h-7 v7 h-12 v-7 h-7 v-12 h7 z" fill="#ffffff" rx="2" filter="url(#shadow)"/>
  
  <!-- Emerald Green Center Cross Accent -->
  <rect x="29" y="25" width="6" height="16" rx="1.5" fill="#10b981"/>
  <rect x="24" y="30" width="16" height="6" rx="1.5" fill="#10b981"/>

  <!-- Graduation Cap (Educational & Training emblem) -->
  <path d="M32 9 L47 15 L32 21 L17 15 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
  <path d="M43 16.5 v5 c0 1 -1.5 2 -3 2" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>
