                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1">
                                                                    {monthItems.map((it, idx) => (
                                                                        <div key={idx} className="text-[11px] bg-slate-50 p-1.5 rounded border border-slate-100 flex flex-col gap-0.5">
                                                                            <span className="font-bold text-slate-700">{it.Category || it.category}:</span>
                                                                            <span className="text-slate-600 truncate" title={it.Policies || it.policies}>
                                                                                {it.Policies || it.policies || <span className="italic text-slate-400">بدون سياسات</span>}
                                                                            </span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Modal Footer */}
                                <div className="p-4 border-t border-slate-100 flex items-center justify-end gap-2.5 bg-slate-50/80">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowGoogleSheetModal(false)}
                                        disabled={isSavingImportedPlan}
                                        className="btn-secondary py-2 px-4 text-xs font-bold text-slate-600 hover:bg-slate-100 cursor-pointer"
                                    >
                                        إلغاء
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={handleSaveImportedPlan}
                                        disabled={isSavingImportedPlan || !fetchedPlanResult || !fetchedPlanResult.items || fetchedPlanResult.items.length === 0}
                                        className="btn-primary bg-emerald-600 hover:bg-emerald-700 border-emerald-600 py-2 px-5 text-xs font-bold flex items-center gap-2 shadow-md shadow-emerald-200 disabled:opacity-50 disabled:shadow-none cursor-pointer"
                                    >
                                        {isSavingImportedPlan ? (
                                            <>
                                                <Icons.Loading />
                                                <span>جاري حفظ واعتماد الخطة في Turso...</span>
                                            </>
                                        ) : (
                                            <>
                                                <Icons.Check />
                                                <span>اعتماد وحفظ الخطة في قاعدة البيانات (Turso)</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SettingsPage = ({ data, refreshData, currentCenter, centers = [], onSelectCenter, onOpenCenterLogin, onDeleteCenter, onAddCenter }) => {
            const getSetting = (type, defaultVal) => {
                const s = data?.settings?.slice().reverse().find(item => item.Type === type);
                return s !== undefined ? s.Value : defaultVal;
            };
            const hospitalName = getSetting('Hospital_Name', currentCenter || 'مستشفى المنيا الجامعى للعيون');
            const hospitalLogo = getSetting('Hospital_Logo', '');
            const hospitalLogoLeft = getSetting('Hospital_Logo_Left', '');
            const [section, setSection] = useState('trainee');
            const [localEmployees, setLocalEmployees] = useState([]);
            const [empSearch, setEmpSearch] = useState("");
            const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
            const [newItem, setNewItem] = useState("");
            const [newTrainerInput, setNewTrainerInput] = useState("");
            const [pasteContent, setPasteContent] = useState("");
            const [singleEmpName, setSingleEmpName] = useState("");
            const [singleEmpJob, setSingleEmpJob] = useState("");
            const [singleEmpCategory, setSingleEmpCategory] = useState(data?.categories?.[0] || "");
            const [isProcessing, setIsProcessing] = useState(false);
            const [hospitalNameInput, setHospitalNameInput] = useState(hospitalName);
            const [hospitalLogoInput, setHospitalLogoInput] = useState(hospitalLogo);
            const [hospitalLogoLeftInput, setHospitalLogoLeftInput] = useState(hospitalLogoLeft);
            const [showTursoImport, setShowTursoImport] = useState(false);

            // Multi-Center management states
            const [newCenterName, setNewCenterName] = useState("");
            const [isAddingCenter, setIsAddingCenter] = useState(false);
            const [centerToDelete, setCenterToDelete] = useState(null);
            const [isDeletingCenter, setIsDeletingCenter] = useState(false);

            const [icManagerTitle, setIcManagerTitle] = useState(getSetting('IC_Manager_Title', 'مدير فريق مكافحة العدوى'));
            const [icManagerName, setIcManagerName] = useState(getSetting('IC_Manager_Name', 'د/ محمود رمضان عبدالسميع'));
            const [hospitalManagerTitle, setHospitalManagerTitle] = useState(getSetting('Hospital_Manager_Title', 'مدير عام المستشفى'));
            const [hospitalManagerName, setHospitalManagerName] = useState(getSetting('Hospital_Manager_Name', 'أ.د/ أحمد عبدالحميد'));
            const [selectedVisitDays, setSelectedVisitDays] = useState(() => getVisitDaysFromSettings(data?.settings));
            const [isSavingVisitDays, setIsSavingVisitDays] = useState(false);

            useEffect(() => {
                setHospitalNameInput(getSetting('Hospital_Name', currentCenter || 'مستشفى المنيا الجامعى للعيون'));
                setHospitalLogoInput(getSetting('Hospital_Logo', ''));
                setHospitalLogoLeftInput(getSetting('Hospital_Logo_Left', ''));
                setIcManagerTitle(getSetting('IC_Manager_Title', 'مدير فريق مكافحة العدوى'));
                setIcManagerName(getSetting('IC_Manager_Name', 'د/ محمود رمضان عبدالسميع'));
                setHospitalManagerTitle(getSetting('Hospital_Manager_Title', 'مدير عام المستشفى'));
                setHospitalManagerName(getSetting('Hospital_Manager_Name', 'أ.د/ أحمد عبدالحميد'));
                setSelectedVisitDays(getVisitDaysFromSettings(data?.settings));
            }, [data?.settings, currentCenter]);

            useEffect(() => {
                if (!singleEmpCategory && data?.categories?.length > 0) {
                    setSingleEmpCategory(data.categories[0]);
                }
            }, [data?.categories, singleEmpCategory]);

            const showToast = useToast();
            const [newCategoryInput, setNewCategoryInput] = useState("");
            
            const [editingPolicy, setEditingPolicy] = useState(null);
            const [editingPolicyValue, setEditingPolicyValue] = useState("");
            const [isRenamingPolicy, setIsRenamingPolicy] = useState(false);

            const handleSavePolicyRename = async (oldName) => {
                const newName = editingPolicyValue.trim();
                if (!newName) return showToast("اسم الموضوع لا يمكن أن يكون فارغاً", "error");
                if (newName === oldName) {
                    setEditingPolicy(null);
                    return;
                }
                setIsRenamingPolicy(true);
                try {
                    const res = await runServer('renamePolicy', oldName, newName);
                    refreshData(res);
                    setEditingPolicy(null);
                    showToast("تم تعديل اسم الموضوع وتحديث كافة الملفات والسجلات بنجاح");
                } catch (e) {
                    showToast(e.message || "حدث خطأ أثناء تعديل اسم الموضوع", "error");
                } finally {
                    setIsRenamingPolicy(false);
                }
            };

            const handleAddCategory = async () => {
                if (!newCategoryInput.trim()) return showToast("اسم الفئة لا يمكن أن يكون فارغاً", "error");
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Category', newCategoryInput.trim());
                    refreshData(res);
                    setNewCategoryInput("");
                    showToast("تمت إضافة الفئة بنجاح");
                } catch (e) {
                    showToast(e.message, "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleDeleteSettingsItem = async (type, value, confirmMessage) => {
                if (confirmMessage && !confirm(confirmMessage)) return;
                setIsProcessing(true);
                try {
                    const res = await runServer('deleteSettingsItem', type, value);
                    refreshData(res);
                    showToast("تم الحذف بنجاح");
                } catch (e) {
                    showToast(e.message, "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            useEffect(() => { 
                setLocalEmployees(data.employees || []); 
                setHasUnsavedChanges(false);
            }, [data.employees]);

            const handleAddSingleEmployee = async () => {
                if (!singleEmpName.trim()) {
                    return showToast("يرجى إدخال اسم الموظف", "error");
                }
                if (!singleEmpCategory.trim()) {
                    return showToast("يرجى اختيار أو كتابة الفئة", "error");
                }
                setIsProcessing(true);
                try {
                    const newEmp = {
                        ID: Math.random().toString(36).substr(2, 9),
                        Name: singleEmpName.trim(),
                        Job: singleEmpJob.trim() || "موظف",
                        Category: singleEmpCategory.trim()
                    };
                    const updatedList = [...localEmployees, newEmp];
                    const res = await runServer('updateEmployeesBulk', updatedList);
                    refreshData(res);
                    setSingleEmpName("");
                    setSingleEmpJob("");
                    showToast("تمت إضافة الموظف بنجاح");
                } catch (e) {
                    showToast(e.message || "حدث خطأ أثناء إضافة الموظف", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleUpdateEmployee = (index, field, value) => {
                setLocalEmployees(prev => {
                    const next = [...prev];
                    next[index] = { ...next[index], [field]: value };
                    // Immediately sync with parent app state so all pages (History, Affidavits, Training) reflect the change instantly
                    if (data) {
                        refreshData({ ...data, employees: next });
                    }
                    return next;
                });
                setHasUnsavedChanges(true);
            };

            const sanitizeEmployeesForSave = (list) => list;

            const handleEmployeeBlur = async () => {
                if (!hasUnsavedChanges || !localEmployees.length) return;
                try {
                    const toSave = sanitizeEmployeesForSave(localEmployees);
                    const res = await runServer('updateEmployeesBulk', toSave);
                    refreshData(res);
                    setHasUnsavedChanges(false);
                } catch (e) {
                    console.error("Auto save error:", e);
                }
            };

            const handleBulkSaveEmployees = async () => {
                setIsProcessing(true);
                try {
                    const toSave = sanitizeEmployeesForSave(localEmployees);
                    const res = await runServer('updateEmployeesBulk', toSave);
                    refreshData(res);
                    setHasUnsavedChanges(false);
                    showToast("تم حفظ وتحديث بيانات الموظفين بنجاح في كافة الصفحات وقاعدة البيانات");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const filteredLocalEmployees = useMemo(() => {
                if (!empSearch.trim()) {
                    return localEmployees.map((emp, idx) => ({ emp, originalIndex: idx }));
                }
                const q = empSearch.toLowerCase().trim();
                return localEmployees
                    .map((emp, idx) => ({ emp, originalIndex: idx }))
                    .filter(({ emp }) => 
                        (emp.Name || "").toLowerCase().includes(q) ||
                        (emp.Job || "").toLowerCase().includes(q) ||
                        (emp.Category || "").toLowerCase().includes(q)
                    );
            }, [localEmployees, empSearch]);

            const handleDeleteEmployee = async (emp, idx) => {
                const empName = (emp.Name || "").trim();
                if (!empName) {
                    setLocalEmployees(prev => prev.filter((_, i) => i !== idx));
                    return;
                }
                const isSavedInDb = (data.employees || []).some(e => e.ID === emp.ID || (e.Name && e.Name.trim() === empName));
                if (!isSavedInDb) {
                    setLocalEmployees(prev => prev.filter((_, i) => i !== idx));
                    showToast("تمت إزالة الموظف من القائمة");
                    return;
                }
                if (confirm(`هل أنت متأكد من حذف الموظف "${empName}"؟\n\nتنبيه: سيتم حذف الموظف وكافة سجلات تدريبه وإفاداته نهائياً لضمان دقة الإحصائيات وعدم تجاوز 100%.`)) {
                    setIsProcessing(true);
                    try {
                        const res = await runServer('deleteEmployee', emp.ID, empName);
                        refreshData(res);
                        setLocalEmployees(prev => prev.filter((_, i) => i !== idx));
                        showToast(`تم حذف الموظف "${empName}" وكافة سجلاته بنجاح`);
                    } catch (e) {
                        showToast(e.message || "حدث خطأ أثناء حذف الموظف", "error");
                    } finally {
                        setIsProcessing(false);
                    }
                }
            };

            const handleProcessPaste = () => {
                if(!pasteContent.trim()) return showToast("يرجى لصق بيانات", "error");
                setIsProcessing(true);
                try {
                    const rows = pasteContent.trim().split(/\r?\n/);
                    const newBatch = rows.map(row => {
                        const cols = row.split('\t');
                        if (cols.length < 1 || !cols[0].trim()) return null;
                        return { ID: Math.random().toString(36).substr(2, 9), Name: cols[0].trim(), Job: cols[1] ? cols[1].trim() : "", Category: cols[2] ? cols[2].trim() : "" };
                    }).filter(Boolean);
                    setLocalEmployees(prev => [...prev, ...newBatch]);
                    setHasUnsavedChanges(true);
                    setPasteContent("");
                    showToast(`تمت إضافة ${newBatch.length} موظف.`);
                } catch (e) { showToast("خطأ: " + e.message, "error"); } 
                finally { setIsProcessing(false); }
            };

            const handleAddItem = async (type) => {
                const val = type === 'Trainer' ? newTrainerInput.trim() : newItem.trim();
                if (!val) return;
                try {
                    const res = await runServer('saveSettingsItem', type, val);
                    refreshData(res);
                    if (type === 'Trainer') setNewTrainerInput("");
                    else setNewItem("");
                    showToast(type === 'Trainer' ? "تمت إضافة المدرب بنجاح" : "تمت إضافة الموضوع بنجاح");
                } catch (e) { showToast(e.message, "error"); }
            };

            const handleUpdateHospitalName = async () => {
                if(!hospitalNameInput.trim()) return showToast("مسمى المستشفى لا يمكن أن يكون فارغاً", "error");
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Hospital_Name', hospitalNameInput);
                    refreshData(res);
                    showToast("تم تحديث مسمى المستشفى بنجاح");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const handleUpdateHospitalLogo = async () => {
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Hospital_Logo', hospitalLogoInput.trim());
                    refreshData(res);
                    showToast(hospitalLogoInput.trim() ? "تم تحديث وحفظ الشعار الأيمن بنجاح" : "تم حذف الشعار الأيمن");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const handleRemoveHospitalLogo = async () => {
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Hospital_Logo', '');
                    setHospitalLogoInput('');
                    refreshData(res);
                    showToast("تم إزالة الشعار الأيمن بنجاح");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const handleUpdateHospitalLogoLeft = async () => {
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Hospital_Logo_Left', hospitalLogoLeftInput.trim());
                    refreshData(res);
                    showToast(hospitalLogoLeftInput.trim() ? "تم تحديث وحفظ الشعار الأيسر بنجاح" : "تم حذف الشعار الأيسر");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const handleRemoveHospitalLogoLeft = async () => {
                setIsProcessing(true);
                try {
                    const res = await runServer('saveSettingsItem', 'Hospital_Logo_Left', '');
                    setHospitalLogoLeftInput('');
                    refreshData(res);
                    showToast("تم إزالة الشعار الأيسر بنجاح");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const handleUpdateCertificateSettings = async () => {
                setIsProcessing(true);
                try {
                    await runServer('saveSettingsItem', 'IC_Manager_Title', icManagerTitle);
                    await runServer('saveSettingsItem', 'IC_Manager_Name', icManagerName);
                    await runServer('saveSettingsItem', 'Hospital_Manager_Title', hospitalManagerTitle);
                    const res = await runServer('saveSettingsItem', 'Hospital_Manager_Name', hospitalManagerName);
                    refreshData(res);
                    showToast("تم تحديث إعدادات الإفادة بنجاح");
                } catch (e) { showToast(e.message, "error"); }
                finally { setIsProcessing(false); }
            };

            const toggleVisitDay = (dayId) => {
                setSelectedVisitDays(prev => (
                    prev.includes(dayId)
                        ? prev.filter(id => id !== dayId)
                        : [...prev, dayId].sort((a, b) => a - b)
                ));
            };

            const currentMonthPreviewDates = useMemo(() => {
                const now = new Date();
                return getAllowedDatesInMonth(now.getFullYear(), now.getMonth() + 1, selectedVisitDays);
            }, [selectedVisitDays]);

            const handleSaveVisitDays = async (overrideDays = null) => {
                const daysToSave = Array.isArray(overrideDays) ? overrideDays : selectedVisitDays;
                setIsSavingVisitDays(true);
                try {
                    const res = await runServer('saveVisitDays', daysToSave);
                    const summary = res?._visitDaysUpdateSummary;
                    if (res && res._visitDaysUpdateSummary) {
                        const cleanRes = { ...res };
                        delete cleanRes._visitDaysUpdateSummary;
                        refreshData(cleanRes);
                    } else {
                        refreshData(res);
                    }
                    setSelectedVisitDays(daysToSave);

                    if (daysToSave.length === 0 || daysToSave.length === 7) {
                        showToast("تم حفظ الإعداد — جميع أيام الشهر متاحة الآن");
                    } else if (summary && (summary.updatedPlansCount > 0 || summary.updatedLogsCount > 0)) {
                        const parts = [];
                        if (summary.updatedPlansCount > 0) parts.push(`${summary.updatedPlansCount} بند خطة`);
                        if (summary.updatedLogsCount > 0) parts.push(`${summary.updatedLogsCount} سجل تدريب`);
                        showToast(`تم حفظ أيام التدريب وتحديث ${parts.join(' و ')} إلى أقرب يوم تدريب`);
                    } else {
                        showToast("تم حفظ أيام التدريب بنجاح (جميع التواريخ المحفوظة مطابقة بالفعل)");
                    }
                } catch (e) {
                    showToast(e.message || "حدث خطأ أثناء حفظ أيام التدريب", "error");
                } finally {
                    setIsSavingVisitDays(false);
                }
            };

            const effectiveCenters = (centers && centers.length > 0) ? centers : (data?.centers || []);
            const activeCenterName = currentCenter || data?.currentCenter || hospitalName;

            const handleCreateCenterInSettings = async (e) => {
                if (e) e.preventDefault();
                const cleanName = newCenterName.trim();
                if (!cleanName) return showToast("يرجى إدخال اسم المركز الجديد", "error");
                setIsAddingCenter(true);
                try {
                    if (onAddCenter) {
                        await onAddCenter(cleanName);
                    } else {
                        await runServer('addCenter', cleanName);
                    }
                    setNewCenterName("");
                    showToast(`تمت إضافة المركز "${cleanName}" بنجاح`);
                } catch (err) {
                    showToast(err.message || "فشل إضافة المركز", "error");
                } finally {
                    setIsAddingCenter(false);
                }
            };

            const handleConfirmDeleteCenter = async () => {
                if (!centerToDelete) return;
                setIsDeletingCenter(true);
                try {
                    if (onDeleteCenter) {
                        await onDeleteCenter(centerToDelete);
                    } else {
                        await runServer('deleteCenter', centerToDelete);
                    }
                    showToast(`تم حذف المركز "${centerToDelete}" وجميع سجلاته بنجاح`);
                    setCenterToDelete(null);
                } catch (err) {
                    showToast(err.message || "فشل حذف المركز", "error");
                } finally {
                    setIsDeletingCenter(false);
                }
            };

            const availableSections = [
                {id:'trainee', l:'إدارة الموظفين'},
                {id:'centers', l:'إدارة المراكز'},
                {id:'other', l:'الإعدادات العامة'}
            ];

            return (
                <div
                    className="max-w-5xl mx-auto p-4 lg:p-6 space-y-6 lg:space-y-8 fade-in pb-24 lg:pb-8 normal-print-content"
                >
                    {/* Print Header for Settings Page */}
                    <div className="print-only">
                        <PrintHeader title="إعدادات النظام" hospitalName={hospitalName} hospitalLogo={hospitalLogo} hospitalLogoLeft={hospitalLogoLeft} />
                    </div>

                    <div className="flex bg-slate-100 p-1.5 rounded-2xl shadow-inner w-full md:w-fit mx-auto overflow-x-auto hide-scrollbar slide-up">
                        {availableSections.map(s => (
                            <button key={s.id} onClick={() => setSection(s.id)} 
                                    className={`px-4 lg:px-8 py-2 lg:py-3 rounded-xl text-xs lg:text-sm font-bold transition-all duration-200 flex-1 md:flex-none whitespace-nowrap ${section === s.id ? 'bg-white text-indigo-600 shadow-sm ring-1 ring-black/5' : 'text-slate-500 hover:text-slate-700'}`}>
                                {s.l}
                            </button>
                        ))}
                    </div>

                    {section === 'trainee' && (
                        <div className="space-y-8 animate-in fade-in zoom-in-95 duration-300">
                            {/* Single Employee Add Card (Available for both user and admin) */}
                            <div className="card p-6 lg:p-8 space-y-4">
                                <div className="flex items-center gap-3 text-indigo-700">
                                    <div className="bg-indigo-100 p-2 rounded-lg"><Icons.UserPlus /></div>
                                    <h4 className="font-bold text-base lg:text-lg">إضافة موظف جديد</h4>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <input
                                        value={singleEmpName}
                                        onChange={e => setSingleEmpName(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleAddSingleEmployee()}
                                        placeholder="اسم الموظف رباعي..."
                                        className="input-base text-sm"
                                    />
                                    <input
                                        value={singleEmpJob}
                                        onChange={e => setSingleEmpJob(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleAddSingleEmployee()}
                                        placeholder="الوظيفة (مثال: فني تمريض)..."
                                        className="input-base text-sm"
                                    />
                                    <div className="flex gap-2">
                                        <select
                                            value={singleEmpCategory}
                                            onChange={e => setSingleEmpCategory(e.target.value)}
                                            className="input-base text-sm font-bold cursor-pointer flex-1"
                                        >
                                            <option value="">اختر الفئة...</option>
                                            {data.categories.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <button
                                            type="button"
                                            onClick={handleAddSingleEmployee}
                                            disabled={isProcessing}
                                            className="btn-primary px-5 whitespace-nowrap shrink-0"
                                        >
                                            {isProcessing ? <Icons.Loading /> : "إضافة"}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="card p-6 lg:p-8 border-dashed border-2 border-indigo-200 bg-indigo-50/50">
                                <div className="flex items-center gap-4 mb-4 text-indigo-700">
                                    <div className="bg-indigo-100 p-2 rounded-lg"><Icons.Clipboard /></div>
                                    <h4 className="font-bold text-base lg:text-lg">إضافة سريعة (نسخ ولصق)</h4>
                                </div>
                                <textarea 
                                    value={pasteContent} 
                                    onChange={e => setPasteContent(e.target.value)} 
                                    placeholder={`الصق البيانات هنا من Excel...\nالترتيب: الاسم [Tab] الوظيفة [Tab] الفئة`} 
                                    className="w-full h-32 p-4 rounded-2xl bg-white border border-indigo-100 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 outline-none text-xs lg:text-sm font-mono leading-relaxed resize-none mb-4"

            if (!isOpen) return null;

                    setTestError("يرجى إدخال رابط قاعدة بيانات Turso السابقة (Database URL)");
                    return;
                }
                setTestError("");
                setIsTesting(true);
                try {
                    const preview = await runServer('testPreviousTursoDb', {
                        url: cleanUrl,
                        authToken: tursoToken.trim()
                    });
                    setPreviewData(preview);
                    const detectedName = (preview.detectedHospitalName || preview.detectedCenters?.[0] || "").trim();

                        setNewTargetCenterName(detectedName);

                    setSourceCenterFilter("all");

            const [showTursoImport, setShowTursoImport] = useState(false);

                    await onAddCenter(clean);
                    setNewCenterName("");

                    await onSelectCenter(clean);
                } catch (err) {
                    showToast(err.message || "فشل إضافة المركز", "error");

                    setIsAdding(false);
                }
            };

                setIsDeleting(true);
                try {

                    showToast(`تم حذف المركز "${centerToDelete}" بنجاح`);

                                <div>
                                    <h1 className="text-xl lg:text-2xl font-black text-slate-900" style={{textWrap: 'balance'}}>اختيار وتبديل المراكز الطبية</h1>
                                    <p className="text-xs lg:text-sm text-slate-500 font-semibold mt-1">
                                        اختر المركز للدخول إلى بياناته المعزولة أو أضف مركزاً جديداً
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 w-full md:w-auto">
                                <button
                                    type="button"
                                    onClick={() => setShowTursoImport(true)}
                                    className="btn-secondary py-2.5 px-4 text-xs font-bold flex-1 md:flex-none"
                                >
                                    <Icons.ImportCloud size={16} />
                                    <span>استيراد من Turso</span>
                                </button>
                                {currentCenter && onCloseIfActive && (
                                    <button
                                        type="button"
                                        onClick={() => onCloseIfActive()}
                                        className="btn-primary py-2.5 px-4 text-xs font-bold flex-1 md:flex-none"
                                    >
                                        <span>العودة للمركز الحالي</span>
                                        <span>←</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Add Center Form */}
                        <div className="card p-6 space-y-3">
                            <h2 className="text-sm font-black text-slate-800">
                                تسجيل مركز أو مستشفى جديد
                            </h2>
                            <form onSubmit={handleCreateCenter} className="flex flex-col sm:flex-row gap-3">
                                <input
                                    type="text"
                                    value={newCenterName}
                                    onChange={e => setNewCenterName(e.target.value)}
                                    placeholder="اكتب اسم المستشفى أو المركز الطبي الجديد..."
                                    className="input-base text-sm flex-1"
                                    disabled={isAdding || isLoading}
                                />
                                <button
                                    type="submit"
                                    disabled={isAdding || isLoading || !newCenterName.trim()}
                                    className="btn-primary px-6 py-3 text-xs font-bold whitespace-nowrap"
                                >
                                    {isAdding ? <Icons.Loading /> : <Icons.Plus />}
                                    <span>إضافة والدخول للمركز</span>
                                </button>
                            </form>
                        </div>

                        {/* Search & Centers Grid */}
                        <div className="card p-6 lg:p-8 space-y-5">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <h2 className="text-base font-black text-slate-900 flex items-center gap-2 tabular-nums">
                                    <Icons.Building size={20} />
                                    <span>المراكز المتاحة · {centers.length}</span>
                                </h2>
                                {centers.length > 3 && (
                                    <div className="relative w-full sm:w-64">
                                        <input
                                            type="text"
                                            value={search}
                                            onChange={e => setSearch(e.target.value)}
                                            placeholder="ابحث عن مركز..."
                                            className="input-base text-xs py-2 pr-9"
                                        />
                                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                                            <Icons.Search />
                                        </span>
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {filteredCenters.map(c => {
                                    const isActive = c.Name === currentCenter;
                                    return (
                                        <div
                                            key={c.ID || c.Name}
                                            className={`p-5 rounded-2xl border transition-all flex flex-col justify-between gap-4 ${
                                                isActive
                                                    ? 'border-sky-400 bg-sky-50/55 shadow-md shadow-sky-500/10'
                                                    : 'border-slate-200/80 bg-white/80 hover:bg-white hover:border-sky-300 hover:shadow-md'
                                            }`}
                                        >
                                            <div className="flex items-start justify-between gap-3">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 transition-colors ${
                                                        isActive ? 'bg-sky-600 text-white shadow-md shadow-sky-500/20' : 'bg-sky-50 text-sky-600 border border-sky-100'
                                                    }`}>
                                                        <Icons.Building size={22} />
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h3 className="font-black text-slate-900 text-sm lg:text-base truncate">{c.Name}</h3>
                                                        <div className="flex items-center gap-2 text-xs text-slate-500 font-semibold mt-1 tabular-nums">
                                                            <span>{c.employeesCount ?? 0} موظف</span>
                                                            <span aria-hidden="true">·</span>
                                                            <span>{c.sessionsCount ?? 0} جلسة</span>
                                                            {isActive && (
                                                                <>
                                                                    <span aria-hidden="true">·</span>
                                                                    <span className="text-sky-700 font-bold">المركز النشط</span>
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-2 pt-3 border-t border-slate-200/60">
                                                <button
                                                    type="button"
                                                    onClick={() => onSelectCenter(c.Name)}
                                                    disabled={isLoading}
                                                    className="btn-primary flex-1 py-2.5 text-xs font-bold"
                                                >
                                                    {isLoading ? <Icons.Loading /> : <Icons.SwitchCenter size={16} />}
                                                    <span>{isActive ? "متابعة العمل في هذا المركز" : "دخول المركز"}</span>
                                                </button>
                                                {centers.length > 1 && (
                                                    <button
                                                        type="button"
                                                        onClick={() => setCenterToDelete(c.Name)}
                                                        disabled={isLoading}
                                                        className="p-2.5 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-xl border border-slate-200 hover:border-red-200 bg-white transition-all"
                                                        title="حذف المركز"
                                                    >
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {centerToDelete && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl border border-slate-100">
                                <h4 className="font-black text-base text-slate-800">تأكيد حذف المركز</h4>
                                <p className="text-xs text-slate-600 leading-relaxed bg-red-50/70 border border-red-100 p-4 rounded-2xl font-semibold">
                                    هل أنت متأكد من حذف المركز <strong className="text-red-700">"{centerToDelete}"</strong>؟ سيتم حذف جميع الموظفين وسجلات التدريب والخطط الخاصة به نهائياً.
                                </p>
                                <div className="flex gap-3">
                                    <button
                                        type="button"
                                        onClick={() => setCenterToDelete(null)}
                                        disabled={isDeleting}
                                        className="btn-secondary flex-1 py-2.5 text-xs font-bold"
                                    >
                                        إلغاء
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleConfirmDelete}
                                        disabled={isDeleting}
                                        className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-1.5"
                                    >
                                        {isDeleting ? <Icons.Loading /> : "حذف المركز نهائياً"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showTursoImport && (
                        <TursoImportModal
                            isOpen={showTursoImport}
                            onClose={() => setShowTursoImport(false)}
                            centers={centers}
                            currentCenter={currentCenter}
                            onImportSuccess={async (importedTargetCenter) => {
                                setShowTursoImport(false);
                                if (importedTargetCenter && typeof importedTargetCenter === 'string') {
                                    await onSelectCenter(importedTargetCenter, true);
                                    showToast(`تم استيراد البيانات والدخول إلى "${importedTargetCenter}"`);
                                }
                            }}
                        />
                    )}
                </div>
            );
        };

        function App() {
            const [data, setData] = useState(null);
            const [centers, setCenters] = useState([]);
            const [currentCenter, setCurrentCenter] = useState(() => getValidStoredCenter());
            const [showCenterLogin, setShowCenterLogin] = useState(false);
            const [isLoadingCenter, setIsLoadingCenter] = useState(false);
            const [view, setView] = useState('stats');

            const hospitalName = data?.settings?.slice().reverse().find(s => s.Type === 'Hospital_Name')?.Value || currentCenter || 'مستشفى المنيا الجامعى للعيون';
            const hospitalLogo = data?.settings?.slice().reverse().find(s => s.Type === 'Hospital_Logo')?.Value || '';

            const handleRefreshData = (updatedData) => {
                setData(updatedData);
                if (updatedData?.centers && Array.isArray(updatedData.centers)) {
                    setCenters(updatedData.centers);
                }
            };

            const loadDataForCenter = async (centerName = "", isInitial = false, forceRefresh = false) => {
                setIsLoadingCenter(true);
                try {
                    const cleanTarget = (typeof centerName === 'string' && !centerName.includes('[object')) ? centerName.trim() : "";
                    const res = await runServer('getAllData', { center: cleanTarget, forceRefresh });
                    setData(res);
                    if (res?.centers && Array.isArray(res.centers)) {
                        setCenters(res.centers);
                    }
                    const resolvedCenter = res?.currentCenter || cleanTarget || res?.centers?.[0]?.Name || "";
                    if (resolvedCenter) {
                        setCurrentCenter(resolvedCenter);
                        try {
                            localStorage.setItem('infection_training_current_center', resolvedCenter);
                        } catch (e) {}
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                    const mock = getInitialMockData();
                    setData(mock);
                    if (mock.centers) setCenters(mock.centers);
                    if (mock.currentCenter && !currentCenter) setCurrentCenter(mock.currentCenter);
                } finally {
                    setIsLoadingCenter(false);
                    if (isInitial) {
                        const loader = document.getElementById('initial-loader');
                        if (loader) loader.style.display = 'none';
                        const root = document.getElementById('root');
                        if (root) root.style.display = 'block';
                    }
                }
            };

            const handleSelectCenter = async (centerName, forceRefresh = false) => {
                if (typeof centerName !== 'string' || !centerName.trim() || centerName.includes('[object')) {
                    return;
                }
                const cleanName = centerName.trim();
                try {
                    localStorage.setItem('infection_training_current_center', cleanName);
                } catch (e) {}
                setCurrentCenter(cleanName);
                setShowCenterLogin(false);
                await loadDataForCenter(cleanName, false, forceRefresh);
            };

            const handleSwitchCenter = async () => {
                setShowCenterLogin(true);
                try {
                    const freshCenters = await runServer('getCenters', { forceRefresh: true });
                    if (Array.isArray(freshCenters)) {
                        setCenters(freshCenters);
                    }
                } catch (e) {
                    console.error("Failed to refresh centers:", e);
                }
            };

            const handleAddCenter = async (newName) => {
                if (typeof newName !== 'string' || !newName.trim()) {
                    throw new Error("يرجى إدخال اسم المركز");
                }
                const updatedCenters = await runServer('addCenter', newName.trim());
                if (Array.isArray(updatedCenters)) {
                    setCenters(updatedCenters);
                }
                return updatedCenters;
            };

            const handleDeleteCenter = async (nameToDelete) => {
                if (typeof nameToDelete !== 'string' || !nameToDelete.trim()) return;
                const cleanTarget = nameToDelete.trim();
                const updatedCenters = await runServer('deleteCenter', cleanTarget);
                if (Array.isArray(updatedCenters)) {
                    setCenters(updatedCenters);
                    if (cleanTarget === currentCenter) {
                        const nextCenter = updatedCenters[0]?.Name || "";
                        try {
                            if (nextCenter) localStorage.setItem('infection_training_current_center', nextCenter);
                            else localStorage.removeItem('infection_training_current_center');
                        } catch (e) {}
                        if (nextCenter) {
                            setCurrentCenter(nextCenter);
                            await loadDataForCenter(nextCenter, false, true);
                        } else {
                            setCurrentCenter("");
                            setShowCenterLogin(true);
                        }
                    }
                }
                return updatedCenters;
            };

            useEffect(() => {
                const stored = getValidStoredCenter();
                loadDataForCenter(stored, true);
            }, []);

            if (!data) return null;

            const navItems = [
                {id:'stats', l:'الإحصائيات', i:<Icons.Stats />},
                {id:'training', l:'تسجيل تدريب', i:<Icons.Training />},
                {id:'history', l:'سجل التدريب', i:<Icons.History />},
                {id:'affidavits', l:'إفادات التدريب', i:<Icons.Certificate />},
                {id:'planView', l:'الخطة السنوية', i:<Icons.Plan />},
                {id:'settings', l:'الإعدادات', i:<Icons.Settings />}
            ];

            const effectiveCenters = (centers && centers.length > 0) ? centers : (data?.centers || []);
            const activeCenterDisplay = currentCenter || data?.currentCenter || hospitalName;

            if (showCenterLogin) {
                return (
                    <ToastProvider>
                        <CenterLoginPage
                            centers={effectiveCenters}
                            currentCenter={activeCenterDisplay}
                            onSelectCenter={handleSelectCenter}
                            onAddCenter={handleAddCenter}
                            onDeleteCenter={handleDeleteCenter}
                            onCloseIfActive={() => setShowCenterLogin(false)}
                            isLoading={isLoadingCenter}
                        />
                    </ToastProvider>
                );
            }

            return (
                <ToastProvider>
                    <div className="app-container font-sans">
                        {/* Desktop Sidebar */}
                        <aside className="sidebar shadow-xl shadow-sky-900/5 z-30 hidden lg:flex">
                            <div className="p-6 pb-3">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 rounded-2xl shadow-md shadow-sky-500/20 flex items-center justify-center overflow-hidden shrink-0 transition-transform duration-300 hover:scale-105">
                                        {hospitalLogo ? (
                                            <img 
                                                src={formatGoogleDriveImageUrl(hospitalLogo)} 
                                                alt="شعار المستشفى" 
                                                className="w-full h-full object-contain rounded-xl bg-white p-0.5 border border-slate-200" 
                                                onError={(e) => {
                                                    if (e.currentTarget.src.includes('lh3.googleusercontent.com/d/')) {
                                                        const id = e.currentTarget.src.split('/d/')[1];
                                                        if (id) e.currentTarget.src = `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
                                                    }
                                                }}
                                            />
                                        ) : (
                                            <Icons.Logo size={48} />
                                        )}
                                    </div>
                                    <div className="min-w-0">
                                        <h1 className="font-black text-base text-slate-900 tracking-tight leading-snug truncate">{hospitalName}</h1>
                                        <span className="text-[11px] font-semibold text-slate-500">وحدة مكافحة العدوى</span>
                                    </div>
                                </div>

                                {/* Center Switcher Panel */}
                                <div className="bg-sky-50/70 border border-sky-200/75 rounded-2xl p-3 space-y-2.5">
                                    <div className="flex items-center justify-between gap-2 text-[11px] font-bold text-sky-700">
                                        <span>المركز الحالي</span>
                                        {effectiveCenters.length > 1 && (
                                            <span className="text-slate-500 tabular-nums">{effectiveCenters.length} مراكز</span>
                                        )}
                                    </div>
                                    <div className="text-xs font-black text-slate-800 truncate flex items-center gap-1.5">
                                        <Icons.Building size={15} />
                                        <span className="truncate">{activeCenterDisplay}</span>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={handleSwitchCenter}
                                        disabled={isLoadingCenter}
                                        className="w-full py-2 px-3 bg-white hover:bg-sky-600 text-sky-700 hover:text-white border border-sky-200/90 hover:border-sky-600 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm whitespace-nowrap"
                                    >
                                        <Icons.SwitchCenter size={15} />
                                        <span>تبديل المركز</span>
                                    </button>
                                </div>
                            </div>

                            <nav className="flex-1 px-4 space-y-1.5 overflow-y-auto py-2">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => setView(item.id)}
                                            className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-bold transition-all duration-200 group relative overflow-hidden whitespace-nowrap ${view === item.id ? 'nav-active bg-sky-50/95 text-sky-700 border border-sky-200/80 shadow-sm' : 'text-slate-600 hover:bg-white hover:text-slate-900 border border-transparent'}`}>
                                        <span className={`p-1 transition-transform duration-200 ${view === item.id ? 'text-sky-600' : 'text-slate-500 group-hover:text-sky-600'}`}>{item.i}</span>
                                        <span className="relative z-10 text-sm">{item.l}</span>
                                        {view === item.id && <span className="mr-auto w-1 h-4 rounded-full bg-sky-500"></span>}
                                    </button>
                                ))}
                            </nav>

                            <div className="p-4 text-center text-[11px] text-slate-400 font-medium border-t border-slate-200/70 mt-auto">
                                © 2026 Dr. Fady Ezzat
                            </div>
                        </aside>

                        <main className="main-content flex flex-col h-full">
                            {/* Mobile Header */}
                            <header className="lg:hidden glass sticky top-0 z-40 px-4 py-2.5 flex items-center justify-between shrink-0 no-print gap-3">
                                 <div className="flex items-center gap-2.5 min-w-0">
                                     <div className="w-8 h-8 rounded-xl shadow-sm flex items-center justify-center overflow-hidden shrink-0">
                                         {hospitalLogo ? (
                                             <img 
                                                 src={formatGoogleDriveImageUrl(hospitalLogo)} 
                                                 alt="شعار المستشفى" 
                                                 className="w-full h-full object-contain rounded-lg bg-white p-0.5" 
                                             />
                                         ) : (
                                             <Icons.Logo size={30} />
                                         )}
                                     </div>
                                     <h1 className="font-bold text-slate-900 text-xs leading-tight truncate">{hospitalName}</h1>
                                 </div>
                                 <div className="flex items-center gap-2 shrink-0">
                                     <span className="text-[11px] font-bold text-slate-500 whitespace-nowrap">
                                         {view === 'stats' && 'الإحصائيات'}
                                         {view === 'training' && 'تسجيل'}
                                         {view === 'history' && 'السجل'}
                                         {view === 'affidavits' && 'الإفادات'}
                                         {view === 'planView' && 'الخطة'}
                                         {view === 'settings' && 'الإعدادات'}
                                     </span>
                                     <button
                                         type="button"
                                         onClick={handleSwitchCenter}
                                         className="text-[11px] font-bold text-sky-700 bg-sky-50 hover:bg-sky-100 px-2.5 py-1.5 rounded-xl border border-sky-200 flex items-center gap-1 transition-all whitespace-nowrap shrink-0"
                                         title="تبديل المركز"
                                     >
                                         <Icons.SwitchCenter size={13} />
                                         <span>تبديل المركز</span>
                                     </button>
                                 </div>
                            </header>

                            {/* Content */}
                            <div className="flex-1 overflow-y-auto">
                                {view === 'stats' && <StatsPage data={data} />}
                                {view === 'training' && <TrainingPage data={data} refreshData={handleRefreshData} />}
                                {view === 'history' && <HistoryPage data={data} refreshData={handleRefreshData} />}
                                {view === 'affidavits' && <AffidavitsPage data={data} />}
                                {view === 'planView' && <PlanViewPage data={data} refreshData={handleRefreshData} />}
                                {view === 'settings' && (
                                    <SettingsPage
                                        data={data}
                                        refreshData={handleRefreshData}
                                        currentCenter={activeCenterDisplay}
                                        centers={effectiveCenters}
                                        onSelectCenter={handleSelectCenter}
                                        onOpenCenterLogin={handleSwitchCenter}
                                        onAddCenter={handleAddCenter}
                                        onDeleteCenter={handleDeleteCenter}
                                    />
                                )}
                            </div>
                        </main>

                        {/* Mobile Navigation */}
                        <nav className="lg:hidden fixed bottom-0 left-0 right-0 bg-white/92 backdrop-blur-xl border-t border-slate-200/80 py-2 px-2 flex justify-around z-50 shadow-[0_-6px_24px_rgba(15,23,42,0.06)] no-print">
                             {navItems.map(item => (
                                <button key={item.id} onClick={() => setView(item.id)} 
                                    className={`p-2.5 rounded-2xl transition-all duration-200 relative ${view === item.id ? 'nav-active text-sky-600 bg-sky-50 -translate-y-1 shadow-md shadow-sky-500/10 border border-sky-200/70' : 'text-slate-500 hover:text-slate-800'}`}>
                                    {item.i}
                                </button>
                            ))}
                        </nav>
                    </div>
                </ToastProvider>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<App />);
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
