    <style>
        
        :root {
            --primary: #0284c7;
            --primary-indigo: #4f46e5;
            --primary-dark: #0369a1;
            --bg-body: #f4f7fb;
            --bg-card: rgba(255, 255, 255, 0.92);
            --border-hairline: rgba(148, 163, 184, 0.24);
        }

        body { 
            font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif; 
            background-color: var(--bg-body);
            background-image:
                radial-gradient(at 88% 8%, rgba(14, 165, 233, 0.09) 0px, transparent 48%),
                radial-gradient(at 12% 20%, rgba(99, 102, 241, 0.07) 0px, transparent 45%),
                radial-gradient(rgba(148, 163, 184, 0.16) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #0f172a;
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .tabular-nums { font-variant-numeric: tabular-nums; }
        table, .stat-num { font-variant-numeric: tabular-nums; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.65); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth Entrance Animations (avoid retaining transform after finish so position:fixed modals always center in viewport) */
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        /* Futuristic Animated SVG Icons */
        .app-icon {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease, filter 0.25s ease;
            transform-origin: center;
        }
        button:hover .app-icon,
        .group:hover .app-icon,
        .nav-active .app-icon {
            transform: scale(1.08);
        }

        @keyframes iconOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .icon-orbit {
            transform-origin: 32px 34px;
            animation: iconOrbit 16s linear infinite;
        }

        @keyframes iconCorePulse {
            0%, 100% { transform: scale(1); opacity: 0.92; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        .icon-core-pulse {
            transform-origin: center;
            animation: iconCorePulse 3s ease-in-out infinite;
        }

        @keyframes iconBarRise {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.68); }
        }
        .icon-bar {
            transform-box: fill-box;
            transform-origin: bottom center;
        }
        button:hover .icon-bar-1, .nav-active .icon-bar-1 { animation: iconBarRise 1.1s ease-in-out infinite; }
        button:hover .icon-bar-2, .nav-active .icon-bar-2 { animation: iconBarRise 1.1s ease-in-out 0.18s infinite; }
        button:hover .icon-bar-3, .nav-active .icon-bar-3 { animation: iconBarRise 1.1s ease-in-out 0.36s infinite; }

        @keyframes iconSpinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(180deg); }
        }
        button:hover .icon-gear, .nav-active .icon-gear {
            transform-origin: center;
            animation: iconSpinSlow 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        @keyframes iconClockSweep {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(45deg); }
        }
        button:hover .icon-clock-hand, .nav-active .icon-clock-hand {
            transform-origin: 12px 12px;
            animation: iconClockSweep 1.3s ease-in-out infinite;
        }

        @keyframes iconFloatDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(2.2px); }
        }
        button:hover .icon-float-down {
            animation: iconFloatDown 0.9s ease-in-out infinite;
        }

        @keyframes iconSwitchSlide {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-2px); }
        }
        button:hover .icon-switch-glide {
            animation: iconSwitchSlide 0.85s ease-in-out infinite;
        }

        @keyframes iconBookOpen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06) translateY(-1px); }
        }
        button:hover .icon-book, .nav-active .icon-book {
            transform-origin: center;
            animation: iconBookOpen 1.3s ease-in-out infinite;
        }

        @keyframes iconBuildingGlow {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }
        .icon-win-1 { animation: iconBuildingGlow 2.4s ease-in-out infinite; }
        .icon-win-2 { animation: iconBuildingGlow 2.4s ease-in-out 0.6s infinite; }
        .icon-win-3 { animation: iconBuildingGlow 2.4s ease-in-out 1.2s infinite; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Loader */
        #initial-loader { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; 
            background: radial-gradient(circle at 50% 35%, #ffffff 0%, #f1f6fc 70%, #e7effa 100%);
            position: fixed; inset: 0; z-index: 9999; 
        }
        .spinner { 
            width: 54px; height: 54px; 
            border: 3px solid rgba(14, 165, 233, 0.16); 
            border-top-color: #0284c7; 
            border-right-color: #4f46e5;
            border-radius: 50%; 
            animation: spin 0.75s linear infinite; 
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.14);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Futuristic Luminous UI Utilities */
        .glass { 
            background: rgba(255, 255, 255, 0.82); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.85); 
        }
        
        .input-base {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.9);
            color: #1e293b;
            font-weight: 500;
            border-radius: 0.75rem;
            padding: 0.625rem 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
        }
        .input-base:focus {
            border-color: #0ea5e9;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15), 0 1px 2px rgba(15, 23, 42, 0.05);
        }

        .btn-primary {
            background-image: linear-gradient(to left, #0284c7, #2563eb, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(14, 165, 233, 0.28), 0 2px 4px -1px rgba(14, 165, 233, 0.15);
            transition: all 0.2s ease;
            border-radius: 0.75rem;
            font-weight: 700;
            padding: 0.625rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-primary:hover:not(:disabled) {
            background-image: linear-gradient(to left, #0ea5e9, #2563eb, #4f46e5);
            box-shadow: 0 10px 20px -4px rgba(14, 165, 233, 0.35), 0 4px 6px -2px rgba(14, 165, 233, 0.18);
        }
        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            filter: grayscale(100%);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 55%);
            pointer-events: none;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.95);
            color: #334155;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease;
            border-radius: 0.75rem;
            font-weight: 700;
            padding: 0.625rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: rgba(240, 249, 255, 0.75);
            border-color: #7dd3fc;
            color: #0369a1;
        }
        .btn-secondary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1rem;
            border: 1px solid rgba(226, 232, 240, 0.75);
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.045), 0 1px 2px rgba(15, 23, 42, 0.02);
        }
        .card:hover {
            box-shadow: 0 12px 28px -6px rgba(14, 165, 233, 0.09), 0 2px 6px rgba(15, 23, 42, 0.03);
            border-color: rgba(125, 211, 252, 0.65);
        }

        .tag-select {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tag-select.selected {
            background-color: rgba(240, 249, 255, 0.9);
            border-color: #7dd3fc;
            color: #075985;
            box-shadow: 0 1px 2px rgba(14, 165, 233, 0.08), 0 0 0 1px #bae6fd;
        }
        .tag-select.unselected {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: rgba(226, 232, 240, 0.8);
            color: #475569;
        }
        .tag-select.unselected:hover {
            border-color: #bae6fd;
            background-color: rgba(240, 249, 255, 0.35);
        }

        @media (min-width: 1024px) {
            .app-container { display: flex; height: 100vh; overflow: hidden; }
            .sidebar { 
                width: 280px; 
                flex-shrink: 0; 
                background: rgba(255, 255, 255, 0.88);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-left: 1px solid rgba(226, 232, 240, 0.9); 
                display: flex; 
                flex-direction: column; 
                z-index: 20; 
            }
            .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; background-color: transparent; }
        }

        /* --- Enhanced Print Styles --- */
        @media print {
            /* 1. Strict A4 Control: Reset Margin to 0 and handle via padding */
            @page { size: landscape; margin: 0; }
            
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                transform: none !important; 
            }

            html, body { 
                width: 100%; 
                height: auto !important; /* Changed from 100% to auto to prevent blank pages */
                margin: 0 !important; 
                padding: 0 !important; 
                background: white !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }

            /* Layout Reset */
            #root, .app-container, .main-content { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            .main-content > div { height: auto !important; overflow: visible !important; display: block !important; padding: 0 !important; margin: 0 !important; }

            /* Normal Reports Container - Add padding to simulate margin */
            .normal-print-content { 
                padding: 10mm !important; 
                padding-bottom: 0 !important; 
                margin-bottom: 0 !important;
            }
            .normal-print-content > *:last-child { margin-bottom: 0 !important; }

            /* Color Adjustments */
            .bg-gradient-to-br, [class*="bg-gradient-"] { background: white !important; border: 2px solid #000 !important; color: black !important; box-shadow: none !important; }
            .text-white { color: black !important; }
            
            .card { 
                box-shadow: none !important; 
                border: none !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                break-inside: auto !important; 
                background: white !important; 
                display: block !important;
                overflow: visible !important;
            }

            /* Global Hide */
            .sidebar, .no-print, header button, .fixed-bottom, #initial-loader, .tab-nav, .floating-btn, .app-container > aside, .card.no-print { display: none !important; }

            /* Print Visibility */
            .print-only { display: block !important; width: 100%; }
            tr.print-only { display: table-row !important; }

            /* --- Certificate Mode (Exclusive) --- */
            body.print-mode-certificates { font-size: 12pt !important; width: 100% !important; margin: 0 !important; padding: 0 !important; background: white !important; }
            
            /* Hide everything that is not the certificate content in this mode */
            body.print-mode-certificates .card,
            body.print-mode-certificates .print-table,
            body.print-mode-certificates .print-header-row,
            body.print-mode-certificates header,
            body.print-mode-certificates .no-print,
            body.print-mode-certificates .normal-print-content,
            body.print-mode-certificates .print-only:not(.certificate-print-content *) {
                display: none !important;
            }

            /* --- Combined Mode (Table + Certificates) --- */
            /* In Combined Mode, we show both the Table (default) and the Certificates appended after */
            body.print-mode-combined .certificate-print-content {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            /* Fix for blank page: Use the first certificate to trigger the break, not the container */
            body.print-mode-combined .certificate-print-content > .certificate-page:first-child {
                page-break-before: always;
                break-before: page;
            }

            /* Reset container paddings/margins to prevent blank space in exclusive mode */
            body.print-mode-certificates #root,
            body.print-mode-certificates .app-container,
            body.print-mode-certificates .main-content,
            body.print-mode-certificates .main-content > div, 
            body.print-mode-certificates .main-content > div > div {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                overflow: visible !important;
            }
            
            /* Ensure container is visible and starts on first page */
            body.print-mode-certificates .certificate-print-content { 
                display: block !important; 
                page-break-before: auto !important; 
                break-before: auto !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Certificate Page - Exact A4 Portrait Centered & Complete */
            .certificate-page {
                position: relative !important;
                width: 100% !important;
                max-width: 100% !important;
                height: 265mm !important;
                max-height: 268mm !important;
                margin: 0 auto !important;
                padding: 12mm 15mm !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                align-items: stretch !important;
                border: 3px double #0f172a !important;
                border-radius: 6px !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                overflow: hidden !important;
                background: white !important;
            }
            
            /* IMPORTANT: Ensure the very last certificate DOES NOT trigger an extra page break */
            .certificate-print-content > .certificate-page:last-child { 
                page-break-after: auto !important; 
                break-after: auto !important; 
                margin-bottom: 0 !important; 
            }

            /* Certificate Header */
            .certificate-header {
                position: relative !important;
                flex-shrink: 0 !important;
                text-align: center !important;
                border-bottom: 2px solid #0f172a !important;
                padding-bottom: 4mm !important;
                margin-bottom: 4mm !important;
                min-height: 75px !important;
            }
            .certificate-logo-box {
                position: absolute !important;
                top: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                width: 65px !important;
                height: 65px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: transparent !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
            }
            .certificate-logo-box-right {
                right: 0 !important;
            }
            .certificate-logo-box-left {
                left: 0 !important;
            }
            .certificate-logo-img {
                max-width: 100% !important;
                max-height: 100% !important;
                width: auto !important;
                height: auto !important;
                object-fit: contain !important;
                display: block !important;
                border: none !important;
                outline: none !important;
                box-shadow: none !important;
            }
            .certificate-header-center {
                width: 100% !important;
                box-sizing: border-box !important;
            }
            .certificate-header-center.pad-both {
                padding: 0 75px !important;
            }
            .certificate-header-center.pad-right {
                padding-right: 75px !important;
                padding-left: 10px !important;
            }
            .certificate-header-center.pad-left {
                padding-left: 75px !important;
                padding-right: 10px !important;
            }
            .certificate-header .hospital-title {
                font-size: 16pt !important;
                font-weight: 800 !important;
                line-height: 1.5 !important;
                color: #0f172a !important;
                margin-bottom: 2mm !important;
            }
            .certificate-header h1 { 
                font-size: 26pt !important;
                font-weight: 900 !important; 
                margin-top: 2mm !important;
                margin-bottom: 1mm !important;
                text-decoration: underline !important; 
                text-underline-offset: 8px !important;
                text-align: center !important;
                color: #0f172a !important;
                letter-spacing: 1px !important;

    <script>
        if (typeof Babel !== 'undefined' && Babel.registerPreset && Babel.availablePresets && Babel.availablePresets['react']) {
            Babel.registerPreset('my-react', {
                presets: [
                    [Babel.availablePresets['react'], { runtime: 'classic' }]

    <script type="text/babel" data-presets="my-react">
        const { useState, useEffect, useMemo, useCallback, createContext, useContext, Fragment } = React;

        // --- Constants ---
        const ARABIC_MONTHS = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", 
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        const ARABIC_WEEKDAYS = [
            { id: 6, label: "السبت" },
            { id: 0, label: "الأحد" },
            { id: 1, label: "الاثنين" },
            { id: 2, label: "الثلاثاء" },
            { id: 3, label: "الأربعاء" },
            { id: 4, label: "الخميس" },
            { id: 5, label: "الجمعة" }
        ];

        const ARABIC_WEEKDAY_MAP = {
            0: "الأحد",
            1: "الاثنين",
            2: "الثلاثاء",
            3: "الأربعاء",
            4: "الخميس",
            5: "الجمعة",
            6: "السبت"
        };

        const parseYmdSafe = (dateStr) => {
            if (!dateStr) return null;
            const clean = String(dateStr).split('T')[0].trim();
            const m = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return null;
            const year = parseInt(m[1], 10);
            const month = parseInt(m[2], 10);
            const day = parseInt(m[3], 10);
            if (month < 1 || month > 12 || day < 1 || day > 31) return null;
            return { year, month, day, clean };
        };

        const formatYmdSafe = (year, month, day) => {
            return `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        const getVisitDaysFromSettings = (settings = []) => {
            if (!Array.isArray(settings)) return [];
            const item = settings.slice().reverse().find(s => s.Type === 'Visit_Days');
            if (!item || !item.Value) return [];
            const set = new Set();
            String(item.Value).split(',').forEach(part => {
                const n = parseInt(part.trim(), 10);
                if (!Number.isNaN(n) && n >= 0 && n <= 6) set.add(n);
            });
            return Array.from(set).sort((a, b) => a - b);
        };

        const getAllowedDatesInMonth = (year, month, visitDays = []) => {
            const y = parseInt(year, 10);
            const m = parseInt(month, 10);
            if (!y || !m || m < 1 || m > 12) return [];
            const restrict = Array.isArray(visitDays) && visitDays.length > 0 && visitDays.length < 7;
            const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
            const result = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
                if (restrict && !visitDays.includes(dow)) continue;
                const dateStr = formatYmdSafe(y, m, d);
                const weekdayName = ARABIC_WEEKDAY_MAP[dow] || "";
                result.push({
                    date: dateStr,
                    day: d,
                    weekday: dow,
                    weekdayName,
                    label: `${weekdayName} ${d} ${ARABIC_MONTHS[m - 1]}`
                });
            }
            return result;
        };

        const snapDateToNearestVisitDay = (dateStr, visitDays = []) => {
            const parsed = parseYmdSafe(dateStr);
            if (!parsed) return dateStr;
            if (!Array.isArray(visitDays) || visitDays.length === 0 || visitDays.length >= 7) {
                return parsed.clean;
            }
            const { year, month, day, clean } = parsed;
            const currentDow = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
            if (visitDays.includes(currentDow)) return clean;

            const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
            let bestDay = null;
            let bestDiff = Infinity;
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(Date.UTC(year, month - 1, d)).getUTCDay();
                if (!visitDays.includes(dow)) continue;
                const diff = Math.abs(d - day);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestDay = d;
                }
            }
            return bestDay !== null ? formatYmdSafe(year, month, bestDay) : clean;
        };

        const formatDateWithWeekday = (dateStr) => {
            const parsed = parseYmdSafe(dateStr);
            if (!parsed) return dateStr || "";
            const dow = new Date(Date.UTC(parsed.year, parsed.month - 1, parsed.day)).getUTCDay();
            const weekdayName = ARABIC_WEEKDAY_MAP[dow] || "";
            return `${weekdayName} ${parsed.day} ${ARABIC_MONTHS[parsed.month - 1]}`;
        };

        // --- Helper functions for policy days and calendar dates ---
        const parsePolicyDaysAndDates = (policyStr) => {
            const match = policyStr.match(/\s*\(([^)]+)\)\s*$/);
            if (match) {
                const inner = match[1].trim();
                const base = policyStr.replace(/\s*\(([^)]+)\)\s*$/, "").trim();
                
                let days = 0;
                let dates = [];
                
                const parts = inner.split(" - ");
                const dayStr = parts[0].trim();
                
                if (dayStr === "يوم واحد" || dayStr === "يوم" || dayStr === "1 يوم") {
                    days = 1;
                } else if (dayStr === "يومان" || dayStr === "يومين" || dayStr === "2 يوم") {
                    days = 2;
                }
                
                if (parts.length > 1) {
                    dates = parts[1].split(",").map(d => d.trim()).filter(Boolean);
                }
                
                return { base, days, dates };
            }
            return { base: policyStr.trim(), days: 0, dates: [] };
        };

        const formatPolicyNameAndDates = (base, days, dates) => {
            const cleanDates = (dates || []).filter(Boolean);
            if (days === 1) {
                const dateStr = cleanDates[0] ? ` - ${cleanDates[0]}` : "";
                return `${base} (يوم واحد${dateStr})`;
            }
            if (days === 2) {
                const dateStr = cleanDates.length > 0 ? ` - ${cleanDates.join(", ")}` : "";
                return `${base} (يومان${dateStr})`;
            }
            return base;
        };

        const getPlanItem = (planList, month, category, year) => {
            if (!planList || !Array.isArray(planList)) return null;
            const catTrimmed = String(category || "").trim();
            const monthNum = parseInt(month, 10);
            const targetYearNum = parseInt(year || new Date().getFullYear(), 10);
            const currentYearNum = new Date().getFullYear();

            let item = planList.find(p => 
                (parseInt(p.Month, 10) === monthNum || String(p.Month).trim() === String(month)) && 
                String(p.Category || "").trim() === catTrimmed && 
                (parseInt(p.Year, 10) === targetYearNum || String(p.Year || "").trim() === String(targetYearNum))
            );
            if (item) return item;

            if (targetYearNum === currentYearNum) {
                item = planList.find(p => 
                    (parseInt(p.Month, 10) === monthNum || String(p.Month).trim() === String(month)) && 
                    String(p.Category || "").trim() === catTrimmed && 
                    (!p.Year || !String(p.Year).trim())
                );
            }
            return item || null;
        };

        const splitPolicies = (policiesStr) => {
            if (!policiesStr) return [];
            const result = [];
            let current = "";
            let parenCount = 0;
            for (let i = 0; i < policiesStr.length; i++) {
                const char = policiesStr[i];
                if (char === '(') parenCount++;
                else if (char === ')') parenCount--;
                
                if (char === ',' && parenCount === 0) {
                    result.push(current.trim());
                    current = "";
                } else {
                    current += char;
                }
            }
            if (current.trim()) {
                result.push(current.trim());
            }
            return result.filter(Boolean);
        };

        const getBasePolicyName = (p) => {
            return parsePolicyDaysAndDates(p).base;
        };

        const formatGoogleDriveImageUrl = (url) => {
            if (!url) return "";
            const trimmed = String(url).trim();
            if (!trimmed) return "";

            // Pattern 1: /file/d/FILE_ID
            const matchFile = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (matchFile && matchFile[1]) {
                return `https://lh3.googleusercontent.com/d/${matchFile[1]}`;
            }

            // Pattern 2: /d/FILE_ID
            const matchD = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (matchD && matchD[1]) {
                return `https://lh3.googleusercontent.com/d/${matchD[1]}`;
            }

            // Pattern 3: [?&]id=FILE_ID
            const matchId = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (matchId && matchId[1]) {
                return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            }

            // Pattern 4: /open?id=FILE_ID
            const matchOpen = trimmed.match(/\/open\?id=([a-zA-Z0-9_-]+)/);
            if (matchOpen && matchOpen[1]) {
                return `https://lh3.googleusercontent.com/d/${matchOpen[1]}`;
            }

            // Pattern 5: Direct Google Drive ID
            if (/^[a-zA-Z0-9_-]{25,50}$/.test(trimmed)) {
                return `https://lh3.googleusercontent.com/d/${trimmed}`;
            }

            return trimmed;
        };

        const exportHTMLToWord = (elementId, filename) => {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            const clone = el.cloneNode(true);
            
            // Remove non-printable elements
            const noPrint = clone.querySelectorAll('.no-print');
            noPrint.forEach(node => node.parentNode.removeChild(node));
            
            // Ensure printable elements are visible
            const printOnly = clone.querySelectorAll('.print-only');
            printOnly.forEach(node => {
                node.style.display = 'block';
            });
            const printTfoot = clone.querySelectorAll('tfoot.print-only');
            printTfoot.forEach(node => {
                node.style.display = 'table-footer-group';
            });
            const printTr = clone.querySelectorAll('tr.print-only');
            printTr.forEach(node => {
                node.style.display = 'table-row';
            });

            // Enforce page breaks for Word
            const elements = clone.querySelectorAll('*');
            elements.forEach(node => {
                const styleAttr = node.getAttribute('style') || '';
                const hasPageBreak = 
                    styleAttr.includes('page-break-after: always') || 
                    styleAttr.includes('pageBreakAfter: always') ||
                    (node.style && node.style.pageBreakAfter === 'always');
                
                if (hasPageBreak) {
                    const br = document.createElement('br');
                    br.style.clear = 'all';
                    br.style.pageBreakBefore = 'always';
                    br.setAttribute('clear', 'all');
                    br.style.msoSpecialCharacter = 'line-break';
                    
                    // Insert the break right after this node
                    if (node.nextSibling) {
                        node.parentNode.insertBefore(br, node.nextSibling);
                    } else {
                        node.parentNode.appendChild(br);
                    }
                }
            });

            // Inline essential styles to match PDF/UI appearance in Word
            const tables = clone.querySelectorAll('table');
            tables.forEach(table => {
                table.style.borderCollapse = 'collapse';
                table.style.width = '100%';
                table.style.marginBottom = '20px';
                table.setAttribute('border', '1');
                
                const cells = table.querySelectorAll('th, td');
                cells.forEach(cell => {
                    cell.style.border = '1px solid #000';
                    cell.style.padding = '8px';
                    cell.style.textAlign = 'center';
                    cell.style.verticalAlign = 'middle';
                });
                
                const ths = table.querySelectorAll('th');
                ths.forEach(th => {
                    th.style.backgroundColor = '#f1f5f9';
                    th.style.fontWeight = 'bold';
                });
            });

            // Additional styles for header layout
            const flexContainers = clone.querySelectorAll('.flex.justify-between, .flex.items-center');
            flexContainers.forEach(h => {
                h.style.display = 'flex';
                h.style.justifyContent = 'space-between';
                h.style.alignItems = 'center';
            });

            // Transform print headers and certificate headers to Word-friendly 3-column table layout
            const printHeaders = clone.querySelectorAll('.print-title-container, .certificate-header');
            printHeaders.forEach(header => {
                const rightBox = header.querySelector('.print-logo-box-right, .certificate-logo-box-right') || 
                                 header.querySelector('.print-logo-box:not(.print-logo-box-left), .certificate-logo-box:not(.certificate-logo-box-left)');
                const leftBox = header.querySelector('.print-logo-box-left, .certificate-logo-box-left');
                const centerBox = header.querySelector('.print-header-center, .certificate-header-center');

                const table = document.createElement('table');
                table.setAttribute('width', '100%');
                table.setAttribute('border', '0');
                table.style.width = '100%';
                table.style.borderCollapse = 'collapse';
                table.style.border = 'none';
                table.style.borderBottom = '3px double #000';
                table.style.marginBottom = '15px';
                table.style.paddingBottom = '10px';

                const tr = document.createElement('tr');
                tr.style.border = 'none';

                // Right cell (far right)
                const tdRight = document.createElement('td');
                tdRight.setAttribute('width', '20%');
                tdRight.setAttribute('align', 'right');
                tdRight.style.width = '20%';
                tdRight.style.border = 'none';
                tdRight.style.verticalAlign = 'middle';
                tdRight.style.textAlign = 'right';
                if (rightBox) {
                    tdRight.innerHTML = rightBox.innerHTML;
                    const img = tdRight.querySelector('img');
                    if (img) {
                        img.setAttribute('width', '65');
                        img.setAttribute('height', '65');
                        img.style.width = '65px';
                        img.style.height = 'auto';
                        img.style.maxHeight = '65px';
                        img.style.maxWidth = '65px';
                        img.style.objectFit = 'contain';
                    }
                }

                // Center cell
                const tdCenter = document.createElement('td');
                tdCenter.setAttribute('width', '60%');
                tdCenter.setAttribute('align', 'center');
                tdCenter.style.width = '60%';
                tdCenter.style.border = 'none';
                tdCenter.style.verticalAlign = 'middle';
                tdCenter.style.textAlign = 'center';
                if (centerBox) tdCenter.innerHTML = centerBox.innerHTML;

                // Left cell (far left)
                const tdLeft = document.createElement('td');
                tdLeft.setAttribute('width', '20%');
                tdLeft.setAttribute('align', 'left');
                tdLeft.style.width = '20%';
                tdLeft.style.border = 'none';
                tdLeft.style.verticalAlign = 'middle';
                tdLeft.style.textAlign = 'left';
                if (leftBox) {
                    tdLeft.innerHTML = leftBox.innerHTML;
                    const img = tdLeft.querySelector('img');
                    if (img) {
                        img.setAttribute('width', '65');
                        img.setAttribute('height', '65');
                        img.style.width = '65px';
                        img.style.height = 'auto';
                        img.style.maxHeight = '65px';
                        img.style.maxWidth = '65px';
                        img.style.objectFit = 'contain';
                    }
                }

                tr.appendChild(tdRight);
                tr.appendChild(tdCenter);
                tr.appendChild(tdLeft);
                table.appendChild(tr);

                header.parentNode.replaceChild(table, header);
            });

            const htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>${filename}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; dir: rtl; text-align: right; }
                        h1, h2, h3, p { text-align: right; margin: 5px 0; }
                        .print-title-container { text-align: center; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 15px; width: 100%; display: block; position: relative; }
                        .print-header-center { text-align: center; }
                        .print-header-center div { margin-bottom: 5px; }
                        .print-logo-box { width: 65px; height: 65px; text-align: center; border: none; }
                        .print-logo-box-right { float: right; border: none; }
                        .print-logo-box-left { float: left; border: none; }
                        .print-logo-img { max-width: 65px; max-height: 65px; border: none; }
                    </style>
                </head>
                <body dir="rtl">
                    ${clone.innerHTML}
                </body>
                </html>
            `;
            
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename + '.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        const formatDatesArabic = (dates) => {
            if (!dates || dates.length === 0) return "";
            return dates.map(d => {
                const parsed = parseYmdSafe(d);
                if (parsed) return formatDateWithWeekday(parsed.clean);
                const dateObj = new Date(d);
                if (isNaN(dateObj.getTime())) return d;
                return `${dateObj.getDate()} ${ARABIC_MONTHS[dateObj.getMonth()]}`;
            }).join("، ");
        };

        const getMonthYearOptions = (dataLogs) => {
            const years = new Set();
            const currentYear = new Date().getFullYear();
            years.add(currentYear);
            years.add(currentYear - 1);
            years.add(currentYear + 1);
            years.add(currentYear + 2);
            
            if (dataLogs && Array.isArray(dataLogs)) {
                dataLogs.forEach(l => {
                    const y = l.Year ? parseInt(l.Year) : (l.Date ? new Date(l.Date).getFullYear() : null);
                    if (y && !isNaN(y)) years.add(y);
                });
            }
            
            const sortedYears = Array.from(years).sort((a, b) => a - b);
            const options = [];
            sortedYears.forEach(yr => {
                for (let m = 1; m <= 12; m++) {
                    options.push({
                        value: `${m}-${yr}`,
                        label: `${ARABIC_MONTHS[m-1]} ${yr}`,
                        month: m,
                        year: yr
                    });
                }
            });
            return options;
        };

        const extractPlanFromLogs = (logs, targetYear) => {
            const yearNum = parseInt(targetYear, 10);
            if (!logs || !Array.isArray(logs)) {
                return { items: [], stats: { totalLogs: 0, monthsCount: 0, categoriesCount: 0, policiesCount: 0 } };
            }

            const relevantLogs = logs.filter(l => {
                let y = null;
                if (l.Year && !isNaN(parseInt(l.Year, 10))) {
                    y = parseInt(l.Year, 10);
                } else if (l.Date) {
                    const parts = String(l.Date).trim().split('-');
                    if (parts.length >= 1) y = parseInt(parts[0], 10);
                }
                return y === yearNum;
            });

            if (relevantLogs.length === 0) {
                return { items: [], stats: { totalLogs: 0, monthsCount: 0, categoriesCount: 0, policiesCount: 0 } };
            }

            const groupMap = new Map();
            const allUniquePolicies = new Set();
            const monthsFound = new Set();
            const categoriesFound = new Set();

            relevantLogs.forEach(log => {
                let m = null;
                if (log.Month && !isNaN(parseInt(log.Month, 10))) {
                    m = parseInt(log.Month, 10);
                } else if (log.Date) {
                    const parts = String(log.Date).trim().split('-');
                    if (parts.length >= 2) m = parseInt(parts[1], 10);
                }
                const cat = String(log.Category || "").trim();
                if (!m || m < 1 || m > 12 || !cat) return;

                monthsFound.add(m);
                categoriesFound.add(cat);

                const groupKey = `${m}___${cat}`;
                if (!groupMap.has(groupKey)) {
                    groupMap.set(groupKey, { month: m, category: cat, policiesMap: new Map() });
                }
                const group = groupMap.get(groupKey);

                const logDate = (log.Date || "").trim();
                const policies = splitPolicies(log.Policies);

                policies.forEach(rawPol => {
                    const { base, dates: parsedDates } = parsePolicyDaysAndDates(rawPol);
                    if (!base) return;

                    allUniquePolicies.add(base);

                    if (!group.policiesMap.has(base)) {
                        group.policiesMap.set(base, new Set());
                    }
                    const dateSet = group.policiesMap.get(base);

                    if (logDate && /^\d{4}-\d{2}-\d{2}$/.test(logDate)) {
                        dateSet.add(logDate);
                    }
                    if (parsedDates && Array.isArray(parsedDates)) {
                        parsedDates.forEach(d => {
                            if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
                                dateSet.add(d);
                            }
                        });
                    }
                });
            });

            const reconstructedItems = [];
            groupMap.forEach(({ month, category, policiesMap }) => {
                const formattedPolicies = [];
                policiesMap.forEach((dateSet, base) => {
                    const sortedDates = Array.from(dateSet).sort();
                    if (sortedDates.length === 1) {
                        formattedPolicies.push(formatPolicyNameAndDates(base, 1, sortedDates));
                    } else if (sortedDates.length >= 2) {
                        formattedPolicies.push(formatPolicyNameAndDates(base, 2, sortedDates.slice(0, 2)));
                    } else {
                        formattedPolicies.push(base);
                    }
                });

                if (formattedPolicies.length > 0) {
                    reconstructedItems.push({
                        year: yearNum,
                        month: month,
                        category: category,
                        policies: formattedPolicies
                    });
                }
            });

            reconstructedItems.sort((a, b) => a.month - b.month || a.category.localeCompare(b.category));

            return {
                items: reconstructedItems,
                stats: {
                    totalLogs: relevantLogs.length,
                    monthsCount: monthsFound.size,
                    categoriesCount: categoriesFound.size,
                    policiesCount: allUniquePolicies.size
                }
            };
        };

            Loading: () => <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        };

        const getValidStoredCenter = () => {
            try {
                const stored = localStorage.getItem('infection_training_current_center');
                if (stored && typeof stored === 'string') {
                    const trimmed = stored.trim();
                    if (trimmed && !trimmed.includes('[object')) {
                        return trimmed;
                    }
                    localStorage.removeItem('infection_training_current_center');
                }
            } catch (e) {}
            return "";
        };

        const getInitialMockData = () => {
            const defaultCenter = getValidStoredCenter() || 'مستشفى المنيا الجامعى للعيون';
            const defaultMock = { 
                employees: [], 
                logs: [], 
                settings: [
                    { Type: 'Hospital_Name', Value: defaultCenter },
                    { Type: 'Category', Value: 'تمريض' },
                    { Type: 'Category', Value: 'أطباء' },
                    { Type: 'Category', Value: 'عمال' },
                    { Type: 'Category', Value: 'إداريين' }
                ], 
                plan: [], 
                categories: ["تمريض", "أطباء", "عمال", "إداريين"],
                centers: [{ ID: 'default', Name: defaultCenter, employeesCount: 0, sessionsCount: 0 }],
                currentCenter: defaultCenter
            };
            try {
                const stored = localStorage.getItem('infection_training_mock');
                if (stored) {
                    const parsed = JSON.parse(stored);

                    let uniqueCategories = [];
                    (parsed.settings || []).forEach(s => {
                        if (s.Type === 'Category') {
                            let cat = String(s.Value || "").trim();
                            if (cat && uniqueCategories.indexOf(cat) === -1) uniqueCategories.push(cat);
                        }
                    });
                    (parsed.employees || []).forEach(emp => {
                        let cat = String(emp.Category || "").trim();
                        if (cat && uniqueCategories.indexOf(cat) === -1) uniqueCategories.push(cat);
                    });
                    if (uniqueCategories.length === 0) {
                        uniqueCategories = ["تمريض", "أطباء", "عمال", "إداريين"];
                    }
                    parsed.categories = uniqueCategories;
                    if (!parsed.centers) parsed.centers = defaultMock.centers;
                    if (!parsed.currentCenter) parsed.currentCenter = defaultCenter;
                    return parsed;
                }
            } catch (e) {}
            return defaultMock;
        };

        const runServer = async (func, ...args) => {
            // Sanitize args against event objects or DOM nodes
            const safeArgs = args.map(arg => {
                if (arg && typeof arg === 'object') {
                    if (arg.nativeEvent || arg.target || arg.nodeType) return null;
                }
                return arg;
            });

            const getCircularReplacer = () => {
                const seen = new WeakSet();
                return (key, value) => {
                    if (value !== null && typeof value === 'object') {
                        if (value.nodeType || value.nativeEvent) return undefined;
                        if (seen.has(value)) return undefined;
                        seen.add(value);
                    }
                    return value;
                };
            };

            const currentCenter = getValidStoredCenter();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => {
                    const dummySheetId = ""; 
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](dummySheetId, ...safeArgs);
                });
            } else {
                let response;
                let requestBody = "";
                try {
                    requestBody = JSON.stringify({ func, args: safeArgs, center: currentCenter }, getCircularReplacer());
                } catch (jsonErr) {
                    console.error("JSON Stringify Error in runServer:", jsonErr);
                    requestBody = JSON.stringify({ func, args: [], center: currentCenter });
                }

                try {
                    response = await fetch('/api/gas', {
                        method: "POST",
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: requestBody
                    });
                } catch (networkErr) {
                    console.error("Network Error:", networkErr);
                    throw new Error("تعذر الاتصال بالخادم. يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى.");
                }

                let result;
                try {
                    result = await response.json();
                } catch (parseErr) {
                    console.error("Parse Error:", parseErr);
                    throw new Error("فشل الاتصال بقاعدة بيانات Turso أو الخادم (استجابة غير صالحة).");
                }

                if (result.status === 'success') {
                    return result.data;
                } else {
                    const msg = result.message || "حدث خطأ غير معروف";
                    if (/TURSO|LIBSQL|HRANA|AUTH_TOKEN|SQLITE_AUTH/i.test(msg)) {
                        throw new Error("فشل الاتصال بقاعدة بيانات Turso. (تأكد من إعداد TURSO_DATABASE_URL و TURSO_AUTH_TOKEN في إعدادات البيئة Environment Variables). \nتفاصيل: " + msg);
                    }
                    throw new Error(msg);
                }
            }
        };

        // --- Common Print Header Component (Fixed for Repeating Header) ---
        const PrintHeader = ({ 
            title, 
            subtitle, 
            hideLogo = false, 
            hospitalName = 'مستشفى المنيا الجامعى للعيون', 
            hospitalLogo = '', 
            hospitalLogoLeft = '' 
        }) => {
            const logoRightUrl = formatGoogleDriveImageUrl(hospitalLogo);
            const logoLeftUrl = formatGoogleDriveImageUrl(hospitalLogoLeft);
            const showRight = !hideLogo && !!logoRightUrl;
            const showLeft = !hideLogo && !!logoLeftUrl;

            let padClass = 'no-logo-padding';
            if (showRight && showLeft) padClass = 'pad-both';
            else if (showRight) padClass = 'pad-right';
            else if (showLeft) padClass = 'pad-left';

            return (
                <div className="print-title-container">
                    {showRight && (
                        <div className="print-logo-box print-logo-box-right">
                            <img 
                                src={logoRightUrl} 
                                alt="الشعار الأيمن" 
                                className="print-logo-img"
                                crossOrigin="anonymous"
                                onError={(e) => {
                                    if (e.currentTarget.src.includes('lh3.googleusercontent.com/d/')) {
                                        const id = e.currentTarget.src.split('/d/')[1];
                                        if (id) e.currentTarget.src = `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
                                    }
                                }}
                            />
                        </div>
                    )}
                    {showLeft && (
                        <div className="print-logo-box print-logo-box-left">
                            <img 
                                src={logoLeftUrl} 
                                alt="الشعار الأيسر" 
                                className="print-logo-img"
                                crossOrigin="anonymous"
                                onError={(e) => {
                                    if (e.currentTarget.src.includes('lh3.googleusercontent.com/d/')) {
                                        const id = e.currentTarget.src.split('/d/')[1];
                                        if (id) e.currentTarget.src = `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
                                    }
                                }}
                            />
                        </div>
                    )}
                    <div className={`print-header-center ${padClass}`}>
                        <div style={{fontSize: '18pt', fontWeight: '800', marginBottom: '5px'}}>{hospitalName}</div>
                        <div style={{fontSize: '14pt', fontWeight: 'bold', marginBottom: '5px', color: '#333'}}>وحدة مكافحة العدوى</div>
                        <div style={{fontSize: '12pt', fontWeight: 'bold', borderTop: '1px solid #000', paddingTop: '5px', marginTop: '5px', display: 'inline-block', paddingLeft: '20px', paddingRight: '20px'}}>
                            {title} {subtitle && <span> - {subtitle}</span>}
                        </div>
                    </div>
                    <div style={{clear: 'both'}}></div>
                </div>
            );
        };

        // --- Common Print Footer Component ---
        const PrintFooter = () => (
            <div className="print-footer">
                <span>تم استخراج التقرير بواسطة: نظام إدارة مكافحة العدوى | © 2026 Dr. Fady Ezzat. All Rights Reserved</span>
                <span>تاريخ الطباعة: {new Date().toLocaleString('ar-EG')}</span>
            </div>
        );

        // --- Components ---

        const StatsPage = ({ data }) => {
            const hospitalName = data?.settings?.slice().reverse().find(s => s.Type === 'Hospital_Name')?.Value || 'مستشفى المنيا الجامعى للعيون';
            const hospitalLogo = data?.settings?.slice().reverse().find(s => s.Type === 'Hospital_Logo')?.Value || '';
            const hospitalLogoLeft = data?.settings?.slice().reverse().find(s => s.Type === 'Hospital_Logo_Left')?.Value || '';
            // Updated State to allow Month and Year Selection
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth() + 1);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            // State to control inclusion of Policy & Category totals when printing / viewing
            const [includePolicyTotals, setIncludePolicyTotals] = useState(() => {
                const saved = localStorage.getItem('stats_include_policy_totals');
                return saved !== null ? saved === 'true' : true;
            });
            const [includeCategoryTotals, setIncludeCategoryTotals] = useState(() => {
                const saved = localStorage.getItem('stats_include_category_totals');
                return saved !== null ? saved === 'true' : true;
            });

            const togglePolicyTotals = () => {
                setIncludePolicyTotals(prev => {
                    const next = !prev;
                    try { localStorage.setItem('stats_include_policy_totals', String(next)); } catch (e) {}
                    return next;
                });
            };

            const toggleCategoryTotals = () => {
                setIncludeCategoryTotals(prev => {
                    const next = !prev;
                    try { localStorage.setItem('stats_include_category_totals', String(next)); } catch (e) {}
                    return next;
                });
            };

            const toggleAllTotals = () => {
                const nextVal = !(includePolicyTotals && includeCategoryTotals);
                setIncludePolicyTotals(nextVal);
                setIncludeCategoryTotals(nextVal);
                try {
                    localStorage.setItem('stats_include_policy_totals', String(nextVal));
                    localStorage.setItem('stats_include_category_totals', String(nextVal));
                } catch (e) {}
            };

            const uniqueYears = useMemo(() => {
                const years = new Set();
                years.add(new Date().getFullYear());
                (data.logs || []).forEach(l => {
                    const y = l.Year ? parseInt(l.Year) : (l.Date ? new Date(l.Date).getFullYear() : null);
                    if (y && !isNaN(y)) {
                        years.add(y);
                    }
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [data.logs]);

            const stats = useMemo(() => {
                const activeEmployees = data.employees || [];
                const activeEmpNamesSet = new Set(activeEmployees.map(e => (e.Name || "").trim()).filter(Boolean));
                const activeNamesByCat = {};
                (data.categories || []).forEach(c => {
                    activeNamesByCat[c] = new Set(activeEmployees.filter(e => e.Category === c).map(e => (e.Name || "").trim()).filter(Boolean));
                });

                const getLogYear = (l) => l.Year ? parseInt(l.Year, 10) : (l.Date ? new Date(l.Date).getFullYear() : null);
                const getLogMonth = (l) => l.Month ? parseInt(l.Month, 10) : (l.Date ? new Date(l.Date).getMonth() + 1 : null);

                const results = data.categories.map(cat => {
                    const totalInCat = activeEmployees.filter(e => e.Category === cat).length;
                    const catValidNames = activeNamesByCat[cat] || new Set();
                    
                    const trainedThisMonthGeneral = new Set(data.logs.filter(l => l.Category === cat && getLogMonth(l) == selectedMonth && getLogYear(l) == selectedYear && catValidNames.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                    const coverageMonthGeneral = totalInCat > 0 ? Math.min(100, Math.round((trainedThisMonthGeneral / totalInCat) * 100)) : 0;

                    const trainedThisYearGeneral = new Set(data.logs.filter(l => l.Category === cat && getLogYear(l) == selectedYear && catValidNames.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                    const coverageYearGeneral = totalInCat > 0 ? Math.min(100, Math.round((trainedThisYearGeneral / totalInCat) * 100)) : 0;

                    const catLogsMonth = data.logs.filter(l => l.Category === cat && getLogMonth(l) == selectedMonth && getLogYear(l) == selectedYear && catValidNames.has((l.TraineeName || "").trim()));
                    const allPoliciesMonth = [];
                    catLogsMonth.forEach(l => splitPolicies(l.Policies).forEach(p => {
                        const base = getBasePolicyName(p);
                        if (base) allPoliciesMonth.push(base);
                    }));
                    const uniquePoliciesMonth = [...new Set(allPoliciesMonth)];
                    
                    const monthlyPolicyDetails = uniquePoliciesMonth.map(p => {
                        const uniqueTrainees = new Set(catLogsMonth.filter(l => splitPolicies(l.Policies).map(getBasePolicyName).includes(p)).map(l => (l.TraineeName || "").trim())).size;
                        return { 
                            name: p, 
                            percentage: totalInCat > 0 ? Math.min(100, Math.round((uniqueTrainees / totalInCat) * 100)) : 0,
                            count: Math.min(totalInCat, uniqueTrainees)
                        };
                    });

                    return { 
                        cat, 
                        total: totalInCat, 
                        coverageMonthGeneral, 
                        coverageYearGeneral,
                        monthlyPolicyDetails
                    };
                });

                const totalEmployees = activeEmployees.length;
                const trainedThisMonthGeneral = new Set(data.logs.filter(l => getLogMonth(l) == selectedMonth && getLogYear(l) == selectedYear && activeEmpNamesSet.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                const generalCoverage = totalEmployees > 0 ? Math.min(100, Math.round((trainedThisMonthGeneral / totalEmployees) * 100)) : 0;
                return { results, generalCoverage };
            }, [data.logs, data.employees, data.categories, selectedMonth, selectedYear]);

            const printTableData = useMemo(() => {
                const activeEmployees = data.employees || [];
                const activeEmpNamesSet = new Set(activeEmployees.map(e => (e.Name || "").trim()).filter(Boolean));
                const activeNamesByCat = {};
                const catCounts = {};
                (data.categories || []).forEach(c => {
                    activeNamesByCat[c] = new Set(activeEmployees.filter(e => e.Category === c).map(e => (e.Name || "").trim()).filter(Boolean));
                    catCounts[c] = activeEmployees.filter(e => e.Category === c).length;
                });

                const getLogYear = (l) => l.Year ? parseInt(l.Year, 10) : (l.Date ? new Date(l.Date).getFullYear() : null);
                const getLogMonth = (l) => l.Month ? parseInt(l.Month, 10) : (l.Date ? new Date(l.Date).getMonth() + 1 : null);

                const yearLogs = (data.logs || []).filter(l => getLogYear(l) === parseInt(selectedYear, 10) && activeEmpNamesSet.has((l.TraineeName || "").trim()));
                const monthLogs = yearLogs.filter(l => getLogMonth(l) === parseInt(selectedMonth, 10));
                
                const allPolicies = new Set();
                monthLogs.forEach(l => splitPolicies(l.Policies).forEach(p => {
                    const base = getBasePolicyName(p);
                    if (base) allPolicies.add(base);
                }));
                
                (data.plan || []).filter(p => {
                    const isSameMonth = parseInt(p.Month, 10) === parseInt(selectedMonth, 10) || String(p.Month).trim() === String(selectedMonth);
                    const isSameYear = parseInt(p.Year, 10) === parseInt(selectedYear, 10) || String(p.Year || "").trim() === String(selectedYear);
                    const isLegacyCurrentYear = (!p.Year || !String(p.Year).trim()) && parseInt(selectedYear, 10) === new Date().getFullYear();
                    return isSameMonth && (isSameYear || isLegacyCurrentYear);
                }).forEach(p => {
                    splitPolicies(p.Policies).forEach(pol => {
                        const base = getBasePolicyName(pol);
                        if (base) allPolicies.add(base);
                    });
                });
                
                const policiesArray = Array.from(allPolicies).sort((a, b) => a.localeCompare(b, 'ar'));
                
                const isPlanned = (cat, pol) => {
                    const item = getPlanItem(data.plan, selectedMonth, cat, selectedYear);
                    if (!item || !item.Policies) return false;
                    return splitPolicies(item.Policies).map(getBasePolicyName).includes(pol);
                };
                
                const totalAll = activeEmployees.length;

                const rows = policiesArray.map(policy => {
                    const policyMonthLogs = monthLogs.filter(l => splitPolicies(l.Policies).map(getBasePolicyName).includes(policy));
                    const policyYearLogs = yearLogs.filter(l => splitPolicies(l.Policies).map(getBasePolicyName).includes(policy));
                    
                    const catCoverage = {};
                    let totalMonthTargetForPolicy = 0;
                    let anyCatPlannedMonth = false;

                    (data.categories || []).forEach(cat => {
                        const planned = isPlanned(cat, policy);
                        const catValidNames = activeNamesByCat[cat] || new Set();
                        const trainedInCat = new Set(policyMonthLogs.filter(l => l.Category === cat && catValidNames.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                        const totalInCat = catCounts[cat] || 0;

                        if (planned) {
                            anyCatPlannedMonth = true;
                            totalMonthTargetForPolicy += totalInCat;
                        }

                        catCoverage[cat] = {
                            planned,
                            target: planned ? totalInCat : 0,
                            trained: trainedInCat,
                            totalInCat,
                            rate: totalInCat > 0 ? Math.min(100, Math.round((trainedInCat / totalInCat) * 100)) : 0
                        };
                    });

                    // 1. Monthly Total for Policy
                    const uniqueTrainedMonth = new Set(policyMonthLogs.map(l => (l.TraineeName || "").trim())).size;
                    const policyMonthTarget = anyCatPlannedMonth ? totalMonthTargetForPolicy : 0;
                    const policyMonthRate = policyMonthTarget > 0 
                        ? Math.min(100, Math.round((uniqueTrainedMonth / policyMonthTarget) * 100)) 
                        : (totalAll > 0 && uniqueTrainedMonth > 0 ? Math.min(100, Math.round((uniqueTrainedMonth / totalAll) * 100)) : 0);

                    // 2. Annual Total for Policy
                    const annualPlannedCats = new Set();
                    (data.plan || []).filter(p => {
                        const isSameYear = parseInt(p.Year, 10) === parseInt(selectedYear, 10) || String(p.Year || "").trim() === String(selectedYear);
                        const isLegacyCurrentYear = (!p.Year || !String(p.Year).trim()) && parseInt(selectedYear, 10) === new Date().getFullYear();
                        return (isSameYear || isLegacyCurrentYear);
                    }).forEach(p => {
                        if (splitPolicies(p.Policies).map(getBasePolicyName).includes(policy) && p.Category) {
                            annualPlannedCats.add(p.Category);
                        }
                    });

                    let totalYearTargetForPolicy = 0;
                    const anyCatPlannedYear = annualPlannedCats.size > 0;
                    if (anyCatPlannedYear) {
                        annualPlannedCats.forEach(c => {
                            totalYearTargetForPolicy += (catCounts[c] || 0);
                        });
                    } else {
                        totalYearTargetForPolicy = totalAll;
                    }

                    const uniqueTrainedYear = new Set(policyYearLogs.map(l => (l.TraineeName || "").trim())).size;
                    const policyYearTarget = totalYearTargetForPolicy;
                    const policyYearRate = policyYearTarget > 0 
                        ? Math.min(100, Math.round((uniqueTrainedYear / policyYearTarget) * 100)) 
                        : 0;

                    return {
                        policy,
                        catCoverage,
                        policyMonthTotal: {
                            target: policyMonthTarget,
                            trained: uniqueTrainedMonth,
                            rate: policyMonthRate,
                            anyPlanned: anyCatPlannedMonth
                        },
                        policyYearTotal: {
                            target: policyYearTarget,
                            trained: uniqueTrainedYear,
                            rate: policyYearRate,
                            anyPlanned: anyCatPlannedYear
                        }
                    };
                });
                
                // Category Summaries across all training
                const catMonthSummary = {};
                const catYearSummary = {};
                (data.categories || []).forEach(cat => {
                    const catValidNames = activeNamesByCat[cat] || new Set();
                    const totalInCat = catCounts[cat] || 0;
                    
                    const uniqueMonth = new Set(monthLogs.filter(l => l.Category === cat && catValidNames.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                    const rateMonth = totalInCat > 0 ? Math.min(100, Math.round((uniqueMonth / totalInCat) * 100)) : 0;
                    catMonthSummary[cat] = {
                        target: totalInCat,
                        trained: uniqueMonth,
                        rate: rateMonth
                    };

                    const uniqueYear = new Set(yearLogs.filter(l => l.Category === cat && catValidNames.has((l.TraineeName || "").trim())).map(l => (l.TraineeName || "").trim())).size;
                    const rateYear = totalInCat > 0 ? Math.min(100, Math.round((uniqueYear / totalInCat) * 100)) : 0;
                    catYearSummary[cat] = {
                        target: totalInCat,
                        trained: uniqueYear,
                        rate: rateYear
                    };
                });

                const hospitalMonthTrained = new Set(monthLogs.map(l => (l.TraineeName || "").trim())).size;
                const hospitalMonthRate = totalAll > 0 ? Math.min(100, Math.round((hospitalMonthTrained / totalAll) * 100)) : 0;

                const hospitalYearTrained = new Set(yearLogs.map(l => (l.TraineeName || "").trim())).size;
                const hospitalYearRate = totalAll > 0 ? Math.min(100, Math.round((hospitalYearTrained / totalAll) * 100)) : 0;

                const hospitalMonthSummary = {
                    target: totalAll,
                    trained: hospitalMonthTrained,
                    rate: hospitalMonthRate
                };

                const hospitalYearSummary = {
                    target: totalAll,
                    trained: hospitalYearTrained,
                    rate: hospitalYearRate
                };

                return { 
                    rows, 
                    catMonthSummary,
                    catYearSummary,
                    hospitalMonthSummary,
                    hospitalYearSummary,
                    catCounts,
                    totalEmployees: totalAll,
                    categoriesToPrint: data.categories || [] 
                };
            }, [data.logs, data.employees, data.plan, data.categories, selectedMonth, selectedYear]);

            const handlePdfSave = () => {
                const existing = document.getElementById('print-stats-style');
                if (existing) existing.remove();
                const style = document.createElement('style');
                style.id = 'print-stats-style';
                style.innerHTML = `@media print { @page { size: landscape !important; margin: 8mm !important; } }`;
                document.head.appendChild(style);

                document.title = `تقرير_إحصائيات_${ARABIC_MONTHS[selectedMonth - 1]}_${selectedYear}`;
                if (document.activeElement) document.activeElement.blur();
                const cleanup = () => {
                    const el = document.getElementById('print-stats-style');
                    if (el) el.remove();
                    window.removeEventListener('afterprint', cleanup);
                };
                window.addEventListener('afterprint', cleanup);
                setTimeout(() => {
                    window.focus();
                    window.print();
                    setTimeout(cleanup, 1200);
                }, 80);
            };

            return (
                <div id="stats-print-area" className="space-y-6 lg:space-y-8 fade-in p-4 lg:p-6 pb-24 lg:pb-6 normal-print-content">
                    {/* Print Header for Stats */}
                    <div className="print-only">
                        <PrintHeader title="تقرير الإحصائيات الشهرية" subtitle={`${ARABIC_MONTHS[selectedMonth - 1]} ${selectedYear}`} hospitalName={hospitalName} hospitalLogo={hospitalLogo} hospitalLogoLeft={hospitalLogoLeft} />
                    </div>

                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-2 lg:mb-4 slide-up no-print">
                        <div>
                            <h2 className="text-xl lg:text-2xl font-bold text-slate-800">سجل التدريب</h2>
                            <p className="text-sm text-slate-500">تحليل أداء التدريب لشهر {ARABIC_MONTHS[selectedMonth - 1]} / {selectedYear}</p>
                        </div>
                        <div className="flex gap-2">
                            {/* Combined Month/Year Selector input (Month Calendar picker) */}
                            <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-4 py-2 hover:border-indigo-300 transition-all shadow-sm no-print">
                                <span className="text-xs font-bold text-slate-400 whitespace-nowrap">الشهر:</span>
                                <input 
                                    type="month" 
                                    value={`${selectedYear}-${String(selectedMonth).padStart(2, '0')}`} 
                                    onChange={(e) => {
                                        if (e.target.value) {
                                            const [y, m] = e.target.value.split('-').map(Number);
                                            setSelectedMonth(m);
                                            setSelectedYear(y);
                                        }
                                    }} 
                                    className="bg-transparent outline-none text-xs lg:text-sm font-bold text-slate-700 cursor-pointer min-w-[130px]" 
                                />
                            </div>
                            <div className="flex items-center gap-2 no-print">
                                <button 
                                    type="button"
                                    onClick={toggleAllTotals} 
                                    title="تحديد أو إلغاء تضمين إجماليات التغطية (السياسات والفئات) عند الطباعة"

            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            const [selectedNewTrainer, setSelectedNewTrainer] = useState("");

                const fromSettings = (data?.settings || [])
                    .filter(s => s.Type === "Trainer")
                    .map(s => String(s.Value || "").trim())
                    .filter(Boolean);
                const fromLogs = (data?.logs || [])
                    .map(l => String(l.Trainer || "").trim())
